    /* ================= Live World Webcams dynamic resolver =================
       Each LWW card is looked up by name on liveworldwebcams.com (WordPress REST
       search), then shown through LWW's own embed widget. LWW keeps the widget
       pointed at the camera's current source, so nothing here goes stale.
       Pin a camera manually with { widgetId: '12345' } or { slug: 'page-slug' }. */
    const LWW_BASE = 'https://liveworldwebcams.com';
    const LWW_CACHE_KEY = 'lww_resolve_v2';
    const LWW_TTL = 7 * 24 * 3600 * 1000;
    let lwwCache = {};
    try { lwwCache = JSON.parse(localStorage.getItem(LWW_CACHE_KEY) || '{}'); } catch (e) {}
    const saveLwwCache = () => { try { localStorage.setItem(LWW_CACHE_KEY, JSON.stringify(lwwCache)); } catch (e) {} };

    async function fetchJson(url, ms = 9000) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), ms);
      try {
        const r = await fetch(url, { headers: { Accept: 'application/json' }, signal: ctrl.signal });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return await r.json();
      } finally { clearTimeout(t); }
    }

    function scoreHit(hit, q, slug) {
      const url = (hit.url || '').toLowerCase();
      const title = (hit.title || '').toLowerCase();
      if (!url.startsWith(LWW_BASE) || url === LWW_BASE + '/') return -1;
      if (/\/(articles|category|tag|author|favorites|go)\//.test(url)) return -1;
      let s = 0, matched = 0;
      if (slug && url.includes('/' + slug)) { s += 100; matched++; }
      q.toLowerCase().split(/\s+/).filter(Boolean).forEach(w => {
        if (title.includes(w) || url.includes(w)) { matched++; s += 5; }
      });
      if (!matched) return -1;
      if (/cam|live/.test(url)) s += 4;
      return s;
    }

    async function resolveLww(item) {
      if (item.widgetId) {
        const k = 'id:' + item.widgetId, c = lwwCache[k];
        if (c && Date.now() - c.t < LWW_TTL) return c;
        const out = { id: String(item.widgetId), page: item.pageUrl || '', t: Date.now(), src: await discoverSource(String(item.widgetId), 'post') };
        lwwCache[k] = out; saveLwwCache(); return out;
      }

      const key = item.slug || item.title;
      const hit = lwwCache[key];
      if (hit && Date.now() - hit.t < LWW_TTL) return hit;

      const queries = [...(item.slug ? [item.slug.replace(/-/g, ' ')] : []), ...(item.queries || [item.title])];
      let lastErr = null;
      for (const q of queries) {
        try {
          const results = await fetchJson(`${LWW_BASE}/wp-json/wp/v2/search?search=${encodeURIComponent(q)}&per_page=20&_fields=id,title,url,subtype`);
          const best = results
            .map(r => ({ r, s: scoreHit(r, q, item.slug) }))
            .filter(x => x.s >= 0)
            .sort((a, b) => b.s - a.s)[0];
          if (best) {
            const out = { id: String(best.r.id), page: best.r.url, t: Date.now() };
            out.src = await discoverSource(out.id, best.r.subtype);
            lwwCache[key] = out; saveLwwCache();
            return out;
          }
        } catch (e) { lastErr = e; }
      }
      throw lastErr || new Error('No matching webcam found on liveworldwebcams.com');
    }


    /* ---- find the camera's original, embeddable source via LWW's open REST API ---- */
    function extractSource(blob) {
      const t = blob.replace(/\\\//g, '/').replace(/\\"/g, '"').replace(/\\u0026/g, '&').replace(/&amp;/g, '&').replace(/&#038;/g, '&');
      let m;
      // any third-party iframe in the page content
      const re = /<iframe[^>]+src=["']([^"']+)["']/gi;
      while ((m = re.exec(t))) {
        const u = m[1].startsWith('//') ? 'https:' + m[1] : m[1];
        if (/^https?:/.test(u) && !/liveworldwebcams\.com/.test(u)) return { kind: 'iframe', url: u };
      }
      if ((m = t.match(/https?:\/\/[^"'\s\\<>]+\.m3u8[^"'\s\\<>]*/))) return { kind: 'hls', url: m[0] };
      if ((m = t.match(/youtube(?:-nocookie)?\.com\/embed\/([\w-]{11})/)) ||
          (m = t.match(/youtube\.com\/watch\?[^"'\s]*?v=([\w-]{11})/)) ||
          (m = t.match(/youtube\.com\/live\/([\w-]{11})/)) ||
          (m = t.match(/youtu\.be\/([\w-]{11})/))) return { kind: 'youtube', id: m[1] };
      if ((m = t.match(/youtube\.com\/channel\/(UC[\w-]{22})/))) return { kind: 'ytchannel', id: m[1] };
      return null;
    }

    async function discoverSource(id, subtype) {
      const urls = [];
      const bases = [...new Set([subtype && subtype !== 'post' ? subtype : null, 'posts', 'pages', 'webcams', 'webcam'].filter(Boolean))];
      bases.forEach(b => urls.push(`${LWW_BASE}/wp-json/wp/v2/${b}/${id}`));
      urls.push(`${LWW_BASE}/wp-json/lww/v1/widget/webcam?id=${id}`);
      const blobs = await Promise.allSettled(urls.map(u => fetchJson(u, 8000)));
      for (const b of blobs) {
        if (b.status !== 'fulfilled') continue;
        const text = JSON.stringify(b.value);
        const src = extractSource(text);
        if (src) return src;
      }
      console.info('[EarthLens] no direct source found for LWW id', id, blobs.map((b, i) => [urls[i], b.status]));
      return null;
    }

    function playerMarkup(res, item) {
      const src = res.src;
      const tag = () => '';
      const link = `<div class="absolute bottom-1 right-2 z-10 bg-black/75 px-2 py-0.5 rounded text-[10px] text-gray-400">via <a href="${res.page || LWW_BASE}" target="_blank" rel="noopener" class="text-blue-400 hover:underline">Live World Webcams</a></div>`;
      const perm = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen';
      if (src && (src.kind === 'youtube' || src.kind === 'ytchannel' || src.kind === 'iframe')) {
        const url = src.kind === 'youtube' ? `https://www.youtube-nocookie.com/embed/${src.id}?autoplay=1&mute=1&playsinline=1&rel=0`
                  : src.kind === 'ytchannel' ? `https://www.youtube-nocookie.com/embed/live_stream?channel=${src.id}&autoplay=1&mute=1&playsinline=1`
                  : src.url;
        return `<iframe src="${url}" title="${item.title}" class="w-full h-full border-0" allow="${perm}" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>${tag('src: ' + src.kind)}${link}`;
      }
      if (src && src.kind === 'hls') {
        return `<video data-hls="${src.url}" class="w-full h-full bg-black" autoplay muted playsinline controls></video>${tag('src: hls')}${link}`;
      }
      // nothing embeddable found: fall back to LWW snapshot widget
      return lwwWidgetMarkup(res.id, res.page);
    }

    function attachHls() {
      const vids = document.querySelectorAll('video[data-hls]');
      if (!vids.length) return;
      const go = () => vids.forEach(v => {
        if (v.dataset.ready) return; v.dataset.ready = '1';
        if (v.canPlayType('application/vnd.apple.mpegurl')) { v.src = v.dataset.hls; return; }
        if (window.Hls && Hls.isSupported()) { const h = new Hls(); h.loadSource(v.dataset.hls); h.attachMedia(v); }
      });
      if (window.Hls) return go();
      const sc = document.createElement('script');
      sc.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js';
      sc.onload = go; document.head.appendChild(sc);
    }

    function lwwWidgetMarkup(id, page) {
      return `
        <div data-lww-widget data-mode="specific" data-id="${id}" data-api="${LWW_BASE}/wp-json/lww/v1/widget" data-utm="lww-widget" data-width="420" class="w-full"></div>
        <div class="absolute bottom-1 right-2 z-10 bg-black/75 px-2 py-0.5 rounded text-[10px] text-gray-400">
          Powered by <a href="${page || LWW_BASE + '/'}" target="_blank" rel="noopener" data-newtab="1" class="text-blue-400 hover:underline">Live World Webcams</a>
        </div>`;
    }

    function lwwFailMarkup(item, err) {
      const q = encodeURIComponent((item.queries && item.queries[0]) || item.title);
      console.warn('[EarthLens] Could not resolve', item.title, err);
      return `
        <div class="w-full h-full flex flex-col items-center justify-center gap-2 p-4 text-center">
          <i class="ph-bold ph-video-camera-slash text-3xl text-gray-500"></i>
          <p class="text-sm text-gray-300">Couldn't load this stream right now</p>
          <p class="text-[10px] text-red-400 break-all max-w-full">${(err && err.message) || err} ${/Failed to fetch|NetworkError/i.test((err && err.message) || '') ? '(blocked by browser/CORS or offline)' : ''}</p>
          <div class="flex gap-2">
            <a href="${LWW_BASE}/?s=${q}" target="_blank" rel="noopener" class="px-3 py-1 text-xs bg-blue-600 hover:bg-blue-500 rounded-md text-white">Find on Live World Webcams</a>
            <button onclick="reloadAll()" class="px-3 py-1 text-xs bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-md text-gray-200">Retry</button>
          </div>
        </div>`;
    }


    /* Tweak the LWW widget's own styling (it lives in a shadow DOM): hide the
       "Watch Live" button and keep the play icon always visible on the image. */
    const LWW_TWEAK_CSS = '.lww-cta{display:none !important} .lww-play{opacity:1 !important} .lww-body{padding-bottom:10px !important}';
    function tweakLwwWidgets() {
      let pending = 0;
      document.querySelectorAll('[data-lww-widget]').forEach(h => {
        if (!h.shadowRoot) { pending++; return; }
        if (h.shadowRoot.querySelector('style[data-tweak]')) return;
        const st = document.createElement('style');
        st.dataset.tweak = '1';
        st.textContent = LWW_TWEAK_CSS;
        h.shadowRoot.appendChild(st);
      });
      return pending;
    }
    function tweakWithRetry(tries = 20) {
      if (tweakLwwWidgets() > 0 && tries > 0) setTimeout(() => tweakWithRetry(tries - 1), 250);
    }

    function loadLwwScript() {
      document.querySelectorAll('script[data-lww-loader]').forEach(s => s.remove());
      const s = document.createElement('script');
      s.async = true;
      s.dataset.lwwLoader = '1';
      s.src = `${LWW_BASE}/wp-content/plugins/lww-embed-widget/assets/widget.js?cb=${Date.now()}`;
      s.onload = () => { if (window.lwwWidgetInit) { try { window.lwwWidgetInit(); } catch (e) {} } tweakWithRetry(); };
      document.head.appendChild(s);
    }


    /* Open a camera's LWW page inside the same card, cropped to the video area.
       The LWW page is rendered at a fixed desktop width, scaled to fit the card,
       and shifted so only the player shows. Align once with the arrows: the
       setting is saved and applies to every camera. */
    const CAL_KEY = 'lww_view_cal_v2';
    // Default crop measured from a real LWW camera page rendered at 1200px wide:
    // the 16:9 player starts ~16px from the left, ~464px from the top, ~845px wide.
    const CAL_DEFAULT = { x: 16, y: 464, z: 1.42 };
    const VIEW_W = 1200;
    const getCal = () => { try { return { ...CAL_DEFAULT, ...JSON.parse(localStorage.getItem(CAL_KEY) || '{}') }; } catch (e) { return { ...CAL_DEFAULT }; } };
    const setCal = (c) => { try { localStorage.setItem(CAL_KEY, JSON.stringify(c)); } catch (e) {} };

    function openInline(slot, href) {
      if (slot.querySelector('.inline-viewer')) return;
      const card = slot.parentElement;
      const v = document.createElement('div');
      v.className = 'inline-viewer absolute inset-0 z-20 bg-black flex flex-col';
      const safe = href.replace(/"/g, '&quot;');
      const btn = 'px-2 py-1 rounded bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700';
      v.innerHTML = `
        <div class="iv-bar flex-none flex items-center justify-between gap-2 px-2 py-1 bg-gray-950 border-b border-gray-800 text-[11px]">
          <button class="iv-back ${btn}">&larr; Back</button>
          <div class="flex items-center gap-1">
            <button class="iv-toggle ${btn}" title="Fine-tune which part of the page is shown">&#9881; Align</button>
            <a href="${safe}" target="_blank" rel="noopener" data-newtab="1" class="px-2 py-1 rounded bg-blue-600 hover:bg-blue-500 text-white whitespace-nowrap">New tab &#8599;</a>
          </div>
        </div>
        <div class="iv-stage flex-none relative w-full overflow-hidden bg-black">
          <iframe src="${safe}" title="Live webcam" scrolling="no"
            allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen
            referrerpolicy="strict-origin-when-cross-origin"></iframe>
          <div class="iv-drag hidden absolute inset-0 z-20 border-2 border-dashed border-blue-400/70" style="cursor:grab;touch-action:none;background:rgba(59,130,246,.06)">
            <span class="absolute top-1 left-1/2 -translate-x-1/2 px-2 py-0.5 rounded bg-black/70 text-[10px] text-blue-300 pointer-events-none">Drag to move &middot; scroll to zoom</span>
          </div>
          <div class="iv-ctl hidden absolute bottom-2 right-2 z-30 flex items-center gap-1 p-1 rounded bg-black/75 text-[11px] text-gray-300">
            <button data-act="up" title="Show higher part of page" class="${btn}">&uarr;</button>
            <button data-act="down" title="Show lower part of page" class="${btn}">&darr;</button>
            <button data-act="left" title="Move view left" class="${btn}">&larr;</button>
            <button data-act="right" title="Move view right" class="${btn}">&rarr;</button>
            <button data-act="zout" title="Zoom out" class="${btn}">&minus;</button>
            <button data-act="zin" title="Zoom in" class="${btn}">+</button>
            <button data-act="reset" title="Reset alignment" class="${btn}">&#8635;</button>
          </div>
        </div>`;
      slot.appendChild(v);
      card.style.alignSelf = 'start';          // don't stretch to the tallest card in the row

      const bar = v.querySelector('.iv-bar');
      const stage = v.querySelector('.iv-stage');
      const fr = stage.querySelector('iframe');
      const apply = () => {
        const c = getCal();
        const w = v.clientWidth || slot.clientWidth || 600;
        const stageH = Math.round(w * 9 / 16);
        stage.style.height = stageH + 'px';
        slot.style.minHeight = '0';
        slot.style.height = (bar.offsetHeight + stageH) + 'px';   // card shrinks to fit the video exactly
        const sc = (w / VIEW_W) * c.z;
        fr.style.cssText = `position:absolute;border:0;background:#fff;width:${VIEW_W}px;height:4000px;` +
          `left:${-c.x * sc}px;top:${-c.y * sc}px;transform:scale(${sc});transform-origin:0 0;`;
      };
      apply();
      if (window.ResizeObserver) new ResizeObserver(apply).observe(v);

      v.querySelector('.iv-back').onclick = () => {
        v.remove();
        slot.style.height = ''; slot.style.minHeight = ''; card.style.alignSelf = '';
      };
      const drag = v.querySelector('.iv-drag'), ctl = v.querySelector('.iv-ctl'), tog = v.querySelector('.iv-toggle');
      tog.onclick = () => {
        const on = drag.classList.contains('hidden');          // turning align mode on?
        drag.classList.toggle('hidden', !on);
        ctl.classList.toggle('hidden', !on);
        tog.innerHTML = on ? '&#10003; Done' : '&#9881; Align';
      };

      // ---- drag to pan, wheel to zoom (only while align mode is on) ----
      const scaleOf = (c) => ((v.clientWidth || slot.clientWidth || 600) / VIEW_W) * c.z;
      let ds = null;
      drag.addEventListener('pointerdown', (e) => {
        drag.setPointerCapture(e.pointerId);
        ds = { px: e.clientX, py: e.clientY, c: getCal() };
        drag.style.cursor = 'grabbing';
        e.preventDefault();
      });
      drag.addEventListener('pointermove', (e) => {
        if (!ds) return;
        const sc = scaleOf(ds.c);
        const c = { ...ds.c };
        c.x = Math.max(0, ds.c.x - (e.clientX - ds.px) / sc);   // content follows the pointer
        c.y = Math.max(0, ds.c.y - (e.clientY - ds.py) / sc);
        setCal(c); apply();
      });
      const endDrag = () => { ds = null; drag.style.cursor = 'grab'; };
      drag.addEventListener('pointerup', endDrag);
      drag.addEventListener('pointercancel', endDrag);
      drag.addEventListener('wheel', (e) => {
        e.preventDefault();
        const c = getCal(), r = stage.getBoundingClientRect();
        const mx = e.clientX - r.left, my = e.clientY - r.top;
        const s0 = scaleOf(c);
        const px = c.x + mx / s0, py = c.y + my / s0;            // page point under the cursor
        c.z = Math.min(4, Math.max(0.4, c.z * Math.exp(-e.deltaY * 0.0015)));
        const s1 = scaleOf(c);
        c.x = Math.max(0, px - mx / s1);                          // keep that point under the cursor
        c.y = Math.max(0, py - my / s1);
        setCal(c); apply();
      }, { passive: false });
      v.querySelector('.iv-ctl').addEventListener('click', (e) => {
        const b = e.target.closest('button[data-act]'); if (!b) return;
        let c = getCal(); const step = 30 / c.z;
        switch (b.dataset.act) {
          case 'up': c.y -= step; break;
          case 'down': c.y += step; break;
          case 'left': c.x -= step; break;
          case 'right': c.x += step; break;
          case 'zin': c.z = Math.min(4, c.z * 1.05); break;
          case 'zout': c.z = Math.max(0.4, c.z / 1.05); break;
          case 'reset': c = { ...CAL_DEFAULT }; break;
        }
        c.x = Math.max(0, c.x); c.y = Math.max(0, c.y);
        setCal(c); apply();
      });
    }

    function hookInlinePlay(slot) {
      if (slot.__inlineHooked) return;
      slot.__inlineHooked = true;
      slot.addEventListener('click', (e) => {
        // composedPath reaches into the widget's shadow DOM
        const a = e.composedPath().find(n => n.tagName === 'A' && n.href);
        if (!a || a.dataset.newtab) return;
        let u; try { u = new URL(a.href); } catch (_) { return; }
        if (u.hostname.indexOf('liveworldwebcams.com') === -1 || u.pathname === '/' ) return; // "More Live Webcams" etc. keep opening normally
        e.preventDefault();
        e.stopPropagation();
        openInline(slot, a.href);
      }, true);
    }

    let renderToken = 0;

    async function renderLocations(data) {
      const token = ++renderToken;
      const lwwJobs = [];
      const grid = document.getElementById('locationGrid');
      grid.innerHTML = '';
      document.getElementById('camCountLabel').textContent = `${data.length} Locations & Streams`;

      const apiKey = localStorage.getItem('gmaps_api_key') || '';
      const keyBtn = document.getElementById('apiKeyBtnText');
      if (keyBtn) keyBtn.textContent = apiKey ? 'Key Active' : 'API Key';

      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'camera-card flex flex-col shadow-lg';
        
        let contentMarkup = '';

        if (item.type === 'lww') {
          const slotId = `lww-slot-${token}-${lwwJobs.length}`;
          contentMarkup = `
            <div id="${slotId}" class="min-h-[22rem] bg-gray-950 relative flex flex-col justify-center items-center overflow-hidden py-3">
              <div class="flex items-center gap-2 text-xs text-gray-500"><i class="ph ph-circle-notch animate-spin text-lg"></i> Finding live stream…</div>
            </div>
          `;
          lwwJobs.push({ item, slotId });
        } else if (item.type === 'panomax') {
          contentMarkup = `
            <div class="aspect-video bg-black relative flex flex-col">
              <iframe
                src="${item.panomaxUrl}"
                title="${item.title}"
                class="w-full h-full border-0"
                allow="fullscreen; accelerometer; gyroscope"
                referrerpolicy="no-referrer-when-downgrade"
                loading="lazy">
              </iframe>
              <div class="bg-gray-950/90 px-3 py-1.5 flex items-center justify-between text-[11px] text-gray-400 border-t border-gray-800">
                <span class="flex items-center gap-1.5 text-blue-400">
                  <i class="ph-bold ph-arrows-out-cardinal"></i> Panomax 360° Interactive View
                </span>
                <a href="${item.externalUrl}" target="_blank" rel="noopener noreferrer" class="hover:text-white flex items-center gap-1">
                  Source <i class="ph ph-arrow-square-out"></i>
                </a>
              </div>
            </div>
          `;
        } else if (item.type === 'streetview') {
          if (apiKey) {
            // Official Street View API: respects exact coordinates and camera heading/pitch
            const embedUrl = `https://www.google.com/maps/embed/v1/streetview?key=${apiKey}&location=${item.lat},${item.lng}&heading=${item.heading}&pitch=${item.pitch}&fov=${item.fov || 90}`;
            contentMarkup = `
              <div class="aspect-video bg-black relative">
                <iframe
                  src="${embedUrl}"
                  title="${item.title} 360 Street View"
                  class="w-full h-full border-0"
                  allowfullscreen
                  loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade">
                </iframe>
                <div class="bg-gray-950/95 px-3 py-1.5 flex items-center justify-between text-[11px] border-t border-gray-800">
                  <span class="text-amber-400 font-medium flex items-center gap-1.5">
                    <i class="ph-bold ph-compass"></i> Facing ${item.heading}°
                  </span>
                  <a href="${item.mapUrl}" target="_blank" rel="noopener noreferrer" class="text-blue-400 hover:text-blue-300 inline-flex items-center gap-1">
                    Direct Link <i class="ph ph-arrow-square-out"></i>
                  </a>
                </div>
              </div>
            `;
          } else {
            // Free No-Key Mode: Exact angle card with direct link
            contentMarkup = `
              <div class="aspect-video bg-gradient-to-br from-gray-900 to-[#070a13] relative flex flex-col justify-between p-4 border-b border-gray-800">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-semibold text-amber-400 bg-amber-950/80 border border-amber-800/80 px-2.5 py-0.5 rounded-full flex items-center gap-1.5">
                    <i class="ph-bold ph-street-view text-sm"></i> Exact 360° Panorama
                  </span>
                  <span class="text-[11px] text-gray-400 font-mono">Heading: ${item.heading}°</span>
                </div>

                <div class="my-auto text-center py-2">
                  <i class="ph-duotone ph-map-pin text-3xl text-blue-400 mb-1"></i>
                  <p class="text-sm font-semibold text-gray-100">${item.title}</p>
                  <p class="text-xs text-gray-400">${item.location}</p>
                  <p class="text-[11px] text-gray-500 font-mono mt-0.5">${item.lat.toFixed(5)}, ${item.lng.toFixed(5)}</p>
                </div>

                <div class="flex items-center justify-between gap-2 pt-2 border-t border-gray-800/70">
                  <button onclick="promptForApiKey()" class="text-[11px] text-gray-400 hover:text-blue-400 underline underline-offset-2">
                    Enable In-Page Embed
                  </button>
                  <a href="${item.mapUrl}" target="_blank" rel="noopener noreferrer" 
                     class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded text-xs font-semibold inline-flex items-center gap-1.5 transition shadow">
                    Launch Exact 360° <i class="ph-bold ph-arrow-square-out"></i>
                  </a>
                </div>
              </div>
            `;
          }
        }

        const badgeColor = item.kind === 'LIVE' ? 'bg-emerald-950 text-emerald-400 border-emerald-800' : 'bg-amber-950 text-amber-400 border-amber-800';

        card.innerHTML = `
          <div class="px-4 py-3 bg-gray-900 border-b border-gray-800 flex items-center justify-between">
            <div class="truncate mr-2">
              <div class="flex items-center gap-2">
                <h2 class="text-sm font-semibold text-white tracking-wide truncate">${item.title}</h2>
                <span class="text-[9px] uppercase font-bold px-1.5 py-0.5 rounded border ${badgeColor}">
                  ${item.kind === 'LIVE' ? 'LIVE' : 'STREET 360°'}
                </span>
              </div>
              <p class="text-xs text-gray-400 flex items-center gap-1 truncate mt-0.5">
                <i class="ph-bold ph-map-pin text-blue-400"></i> ${item.location}
              </p>
            </div>
            <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-gray-800 text-gray-300 border border-gray-700 whitespace-nowrap">
              ${item.category}
            </span>
          </div>
          ${contentMarkup}
        `;
        grid.appendChild(card);
      });

      await Promise.allSettled(lwwJobs.map(async ({ item, slotId }) => {
        let html;
        try {
          const res = await resolveLww(item);
          html = playerMarkup(res, item);
        } catch (err) {
          html = lwwFailMarkup(item, err);
        }
        if (token !== renderToken) return;           // a newer render replaced this one
        const slot = document.getElementById(slotId);
        if (slot) { slot.innerHTML = html; hookInlinePlay(slot); }
      }));
      if (token === renderToken && lwwJobs.length) { loadLwwScript(); attachHls(); }
    }

    function promptForApiKey() {
      const current = localStorage.getItem('gmaps_api_key') || '';
      const key = prompt(
        'To display live 360° Street Views directly inside this page without leaving the tab, enter your Google Maps Embed API Key:\n\n(Leave empty to use 1-click launch mode)',
        current
      );
      if (key !== null) {
        localStorage.setItem('gmaps_api_key', key.trim());
        renderLocations(items);
      }
    }

    function setGrid(cols) {
      const grid = document.getElementById('locationGrid');
      grid.className = `grid gap-5 ${
        cols === 1 ? 'grid-cols-1' :
        cols === 2 ? 'grid-cols-1 md:grid-cols-2' :
        cols === 3 ? 'grid-cols-1 md:grid-cols-2 xl:grid-cols-3' :
        'grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4'
      }`;
    }

    function filterLocations() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filter = document.getElementById('categoryFilter').value;

      const filtered = items.filter(c => {
        const matchesQuery = 
          c.title.toLowerCase().includes(q) || 
          c.location.toLowerCase().includes(q) || 
          c.category.toLowerCase().includes(q);

        let matchesCat = true;
        if (filter === 'LIVE') matchesCat = (c.kind === 'LIVE');
        else if (filter === 'STREET') matchesCat = (c.kind === 'STREET');
        else if (filter !== 'ALL') matchesCat = (c.category === filter);

        return matchesQuery && matchesCat;
      });

      renderLocations(filtered);
    }

    function reloadAll() {
      renderLocations(items);
      coldKey = '';            // force the coldest-places cards to rebuild too
      loadColdest();
    }

    /* ================= Coldest places: live top-3 cards =================
       Reads the current ranking from LWW's embed page, then shows each of the
       three locations as a card with its live camera (same resolver/player as
       the grid below). If the ranking can't be read (CORS/offline) it falls
       back to LWW's own embed so the section is never empty. */
    const COLD_URL = LWW_BASE + '/coldest-places/?lww_embed=1';
    const COLD_REFRESH = 10 * 60 * 1000;
    let coldKey = '', coldToken = 0;

    const esc = (s) => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

    async function fetchText(url, ms = 9000) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), ms);
      try {
        const r = await fetch(url, { signal: ctrl.signal });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return await r.text();
      } finally { clearTimeout(t); }
    }

    function camPath(a) {
      let u; try { u = new URL(a.getAttribute('href'), LWW_BASE); } catch (e) { return null; }
      if (!/(^|\.)liveworldwebcams\.com$/.test(u.hostname)) return null;
      const p = u.pathname.replace(/\/+$/, '');
      return (!p || p === '/coldest-places') ? null : p;
    }

    function parseColdest(html) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const tempRe = /(-?\d+(?:\.\d+)?)\s*°\s*C/;
      const countCams = (el) => new Set([...el.querySelectorAll('a[href]')].map(camPath).filter(Boolean)).size;
      const out = [], seen = new Set();
      doc.querySelectorAll('a[href]').forEach(a => {
        if (out.length >= 3) return;
        const p = camPath(a);
        const name = a.textContent.replace(/^[^\p{L}\p{N}]+/u, '').trim();
        if (!p || !name || seen.has(p)) return;
        // climb to the smallest ancestor that holds this one camera plus its temperature
        let row = a.parentElement, text = '';
        while (row && row !== doc.body) {
          if (tempRe.test(row.textContent) && countCams(row) === 1) { text = row.textContent; break; }
          row = row.parentElement;
        }
        const c = text.match(tempRe), f = text.match(/(-?\d+(?:\.\d+)?)\s*°\s*F/);
        if (!c) return;
        seen.add(p);
        out.push({ name, url: LWW_BASE + p + '/', slug: p.split('/').pop(), c: c[1], f: f ? f[1] : null });
      });
      return out;
    }

    function coldFallback(grid) {
      grid.innerHTML = `
        <div class="lg:col-span-3 camera-card p-3">
          <iframe src="${COLD_URL}" width="100%" height="360" frameborder="0" scrolling="no" loading="lazy"
            title="Coldest Places Right Now | LiveWorldWebcams"
            style="border-radius:6px;border:1px solid #e5e7eb;box-shadow:0 2px 12px rgba(0,0,0,.06);"></iframe>
        </div>`;
    }

    const tempMarkup = (x) => `${esc(x.c)}°C${x.f ? ` <span class="text-xs font-medium text-sky-300/60">${esc(x.f)}°F</span>` : ''}`;

    async function loadColdest() {
      const grid = document.getElementById('coldGrid');
      if (!grid) return;
      let list;
      try {
        list = parseColdest(await fetchText(COLD_URL));
        if (!list.length) throw new Error('No rankings found');
      } catch (err) {
        console.warn('[EarthLens] Coldest places unavailable, using embed fallback', err);
        if (!grid.dataset.ready) { grid.dataset.ready = 'fallback'; coldFallback(grid); }
        return;
      }

      const upd = document.getElementById('coldUpdated');
      if (upd) upd.textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const key = list.map(x => x.slug).join('|');
      if (key === coldKey) {                       // same top 3: just refresh the temperatures
        list.forEach((x, i) => { const el = document.getElementById(`cold-temp-${i}`); if (el) el.innerHTML = tempMarkup(x); });
        return;
      }

      coldKey = key;
      const token = ++coldToken;
      grid.dataset.ready = '1';
      grid.innerHTML = '';
      const medals = ['🥇', '🥈', '🥉'];
      const jobs = [];

      list.forEach((x, i) => {
        const [place, ...rest] = x.name.split(',');
        const slotId = `cold-slot-${token}-${i}`;
        const card = document.createElement('div');
        card.className = 'camera-card flex flex-col shadow-lg';
        card.innerHTML = `
          <div class="px-4 py-3 bg-gray-900 border-b border-gray-800 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
              <span class="text-2xl leading-none">${medals[i]}</span>
              <div class="truncate">
                <h3 class="text-sm font-semibold text-white tracking-wide truncate">${esc(place.trim())}</h3>
                <p class="text-xs text-gray-400 flex items-center gap-1 truncate mt-0.5">
                  <i class="ph-bold ph-map-pin text-blue-400"></i> ${esc(rest.join(',').trim() || x.name)}
                </p>
              </div>
            </div>
            <div id="cold-temp-${i}" class="text-xl font-bold text-sky-300 whitespace-nowrap">${tempMarkup(x)}</div>
          </div>
          <div id="${slotId}" class="min-h-[22rem] bg-gray-950 relative flex flex-col justify-center items-center overflow-hidden py-3">
            <div class="flex items-center gap-2 text-xs text-gray-500"><i class="ph ph-circle-notch animate-spin text-lg"></i> Finding live stream…</div>
          </div>`;
        grid.appendChild(card);
        jobs.push({ item: { title: place.trim(), slug: x.slug, queries: [x.name] }, slotId });
      });

      await Promise.allSettled(jobs.map(async ({ item, slotId }) => {
        let html;
        try { html = playerMarkup(await resolveLww(item), item); }
        catch (err) { html = lwwFailMarkup(item, err); }
        if (token !== coldToken) return;           // a newer ranking replaced these cards
        const slot = document.getElementById(slotId);
        if (slot) { slot.innerHTML = html; hookInlinePlay(slot); }
      }));
      if (token === coldToken) {
        if (grid.querySelector('[data-lww-widget]')) loadLwwScript();
        attachHls();
      }
    }

    // Initial load
    renderLocations(items);
    loadColdest();
    setInterval(loadColdest, COLD_REFRESH);
  </script>
</body>
</html>
