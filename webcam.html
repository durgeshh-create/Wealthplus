<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>EarthLens — Global Live Webcams & Exact 360° Street Views</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script async src="https://liveworldwebcams.com/wp-content/plugins/lww-embed-widget/assets/widget.js"></script>

  <style>
    body { background-color: #0b0f19; color: #f1f5f9; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .camera-card { background: #111827; border: 1px solid #1f2937; border-radius: 0.75rem; overflow: hidden; transition: border-color 0.2s, box-shadow 0.2s; }
    .camera-card:hover { border-color: #3b82f6; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
    .aspect-video { aspect-ratio: 16 / 9; }
    [data-lww-widget] iframe { width: 100% !important; height: 100% !important; border: 0 !important; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-[#0d1424]/95 backdrop-blur border-b border-gray-800 px-4 py-3">
    <div class="max-w-[1920px] mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center text-white text-xl shadow-md shadow-blue-500/20">
          <i class="ph-bold ph-globe-hemisphere-west"></i>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <h1 class="font-bold text-lg tracking-wide text-white">EarthLens</h1>
            <span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800/80 flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> LIVE
            </span>
          </div>
          <p class="text-xs text-gray-400" id="camCountLabel">25 Locations & Streams</p>
        </div>
      </div>

      <!-- Controls -->
      <div class="flex flex-wrap items-center gap-2">
        <div class="relative">
          <i class="ph ph-magnifying-glass absolute left-3 top-2.5 text-gray-400"></i>
          <input
            id="searchInput"
            type="text"
            placeholder="Search location, street..."
            class="bg-gray-900 border border-gray-700 text-sm text-gray-200 pl-9 pr-3 py-1.5 rounded-lg focus:outline-none focus:border-blue-500 w-44 md:w-56"
            oninput="filterLocations()"
          />
        </div>

        <select 
          id="categoryFilter" 
          onchange="filterLocations()" 
          class="bg-gray-900 border border-gray-700 text-sm text-gray-200 px-3 py-1.5 rounded-lg focus:outline-none focus:border-blue-500">
          <option value="ALL">All Categories</option>
          <option value="LIVE">Live Streams Only</option>
          <option value="STREET">360° Street Views Only</option>
          <option value="Americas">Americas (USA / Canada)</option>
          <option value="Europe">Europe & UK</option>
          <option value="Norway">Norway</option>
          <option value="Asia">Asia</option>
          <option value="Oceania">Oceania</option>
        </select>

        <div class="hidden sm:flex bg-gray-900 border border-gray-800 rounded-lg p-1 space-x-1">
          <button onclick="setGrid(1)" title="1 Column" class="p-1.5 hover:bg-gray-800 rounded text-gray-400 hover:text-white"><i class="ph-bold ph-square"></i></button>
          <button onclick="setGrid(2)" title="2 Columns" class="p-1.5 hover:bg-gray-800 rounded text-gray-400 hover:text-white"><i class="ph-bold ph-columns"></i></button>
          <button onclick="setGrid(3)" title="3 Columns" class="p-1.5 bg-gray-800 rounded text-blue-400"><i class="ph-bold ph-grid-four"></i></button>
          <button onclick="setGrid(4)" title="4 Columns" class="p-1.5 hover:bg-gray-800 rounded text-gray-400 hover:text-white"><i class="ph-bold ph-grid-nine"></i></button>
        </div>

        <button onclick="promptForApiKey()" title="Configure Google Maps Embed API Key" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs font-medium rounded-lg flex items-center gap-1.5 border border-gray-700 transition">
          <i class="ph-bold ph-key"></i> <span id="apiKeyBtnText">API Key</span>
        </button>

        <button onclick="reloadAll()" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs font-medium rounded-lg flex items-center gap-1.5 border border-gray-700 transition">
          <i class="ph ph-arrows-clockwise"></i> Reload
        </button>
      </div>
    </div>
  </header>

  <!-- Grid -->
  <main class="flex-1 max-w-[1920px] w-full mx-auto p-4 md:p-6">
    <div id="locationGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
      <!-- Injected by JS -->
    </div>
  </main>

  <footer class="py-4 border-t border-gray-800 text-center text-xs text-gray-500">
    EarthLens &bull; Exact-Angle Street View Photospheres & GitHub Pages Live Monitoring
  </footer>

  <script>
    const items = [
      /* ========== LIVE WEBCAMS ========== */

      { type: 'youtube', id: '7gBzLGlJnwk', title: 'Niagara Falls Panoramic', location: 'Ontario, Canada', category: 'Americas', kind: 'LIVE' },
      { type: 'youtube', id: 'Bl31TjIJAzI', title: 'Pattaya Beach & Skyline', location: 'Pattaya, Thailand', category: 'Asia', kind: 'LIVE' },

      { type: 'youtube', id: 'mt7uE-n0YPI', title: 'Venice Skyline', location: 'Venice, Italy', category: 'Europe', kind: 'LIVE' },
      { type: 'youtube', id: 'r8N6IsoIkTk', title: 'Venice Grand Canal', location: 'Venice, Italy', category: 'Europe', kind: 'LIVE' },
      { type: 'youtube', id: 'xlepdTYU6G4', title: 'Harstad Harbor', location: 'Harstad, Norway', category: 'Norway', kind: 'LIVE' },
      { type: 'youtube', id: 'faKBmRq0lYg', title: 'Oslo Cityscape', location: 'Oslo, Norway', category: 'Norway', kind: 'LIVE' },
      {

      },
      { type: 'youtube', id: '2D8hhRDEzwY', title: 'Mehamn Arctic Coast', location: 'Finnmark, Norway', category: 'Norway', kind: 'LIVE' },
      { type: 'youtube', id: 'Gd9d4q6WvUY', title: 'Amsterdam Canals', location: 'Amsterdam, Netherlands', category: 'Europe', kind: 'LIVE' },
      { type: 'youtube', id: 'UCgLr29bxO8', title: 'Rhine Falls', location: 'Neuhausen, Switzerland', category: 'Europe', kind: 'LIVE' },
      { type: 'youtube', id: 'lsxYH2XQQCg', title: 'Japan Monkey Center', location: 'Aichi, Japan', category: 'Asia', kind: 'LIVE' },
      { type: 'youtube', id: 'SUXPnIEpbn4', title: 'Chengdu Panda Base', location: 'Sichuan, China', category: 'Asia', kind: 'LIVE' },

      /* ========== EXACT 360° STREET VIEWS ========== */
      {
        type: 'streetview',

      {

      },
      {
        type: 'streetview',
        title: 'Thon Hotel Sandvika',
        location: 'Sandvika, Bærum, Norway',

        lng: 10.525556,
        heading: 215,

        mapUrl: 'https://maps.app.goo.gl/RTm1M2bghs5XJLKh8',
        category: 'Norway',
        kind: 'STREET'
      }
    ];

    function renderLocations(data) {
      const grid = document.getElementById('locationGrid');
      grid.innerHTML = '';
      document.getElementById('camCountLabel').textContent = `${data.length} Locations & Streams`;

      const apiKey = localStorage.getItem('gmaps_api_key') || '';
      const keyBtn = document.getElementById('apiKeyBtnText');
      if (keyBtn) keyBtn.textContent = apiKey ? 'Key Active' : 'API Key';

      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'camera-card flex flex-col shadow-lg';
        
        let contentMarkup = '';

        if (item.type === 'youtube') {
          const embedUrl = `https://www.youtube-nocookie.com/embed/${item.id}?autoplay=1&mute=1&playsinline=1&rel=0&enablejsapi=1`;
          contentMarkup = `
            <div class="aspect-video bg-black relative">
              <iframe
                src="${embedUrl}"
                title="${item.title}"
                class="w-full h-full border-0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                loading="lazy"
                allowfullscreen>
              </iframe>
            </div>
          `;
        } else if (item.type === 'lww') {
          contentMarkup = `
            <div class="aspect-video bg-gray-950 relative flex flex-col justify-center items-center overflow-hidden">
              <div data-lww-widget data-mode="specific" data-id="${item.widgetId}" data-api="https://liveworldwebcams.com/wp-json/lww/v1/widget" data-utm="lww-widget" class="w-full h-full"></div>
              <div class="absolute bottom-1 right-2 z-10 bg-black/75 px-2 py-0.5 rounded text-[10px] text-gray-400">
                Powered by <a href="https://liveworldwebcams.com/" target="_blank" rel="noopener" class="text-blue-400 hover:underline">Live World Webcams</a>
              </div>
            </div>
          `;
        } else if (item.type === 'panomax') {
          contentMarkup = `
            <div class="aspect-video bg-black relative flex flex-col">
              <iframe
                src="${item.panomaxUrl}"
                title="${item.title}"
                class="w-full h-full border-0"
                allow="fullscreen; accelerometer; gyroscope"
                referrerpolicy="no-referrer-when-downgrade"
                loading="lazy">
              </iframe>
              <div class="bg-gray-950/90 px-3 py-1.5 flex items-center justify-between text-[11px] text-gray-400 border-t border-gray-800">
                <span class="flex items-center gap-1.5 text-blue-400">
                  <i class="ph-bold ph-arrows-out-cardinal"></i> Panomax 360° Interactive View
                </span>
                <a href="${item.externalUrl}" target="_blank" rel="noopener noreferrer" class="hover:text-white flex items-center gap-1">
                  Source <i class="ph ph-arrow-square-out"></i>
                </a>
              </div>
            </div>
          `;
        } else if (item.type === 'streetview') {
          if (apiKey) {
            // Official Street View API: respects exact coordinates and camera heading/pitch
            const embedUrl = `https://www.google.com/maps/embed/v1/streetview?key=${apiKey}&location=${item.lat},${item.lng}&heading=${item.heading}&pitch=${item.pitch}&fov=${item.fov || 90}`;
            contentMarkup = `
              <div class="aspect-video bg-black relative">
                <iframe
                  src="${embedUrl}"
                  title="${item.title} 360 Street View"
                  class="w-full h-full border-0"
                  allowfullscreen
                  loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade">
                </iframe>
                <div class="bg-gray-950/95 px-3 py-1.5 flex items-center justify-between text-[11px] border-t border-gray-800">
                  <span class="text-amber-400 font-medium flex items-center gap-1.5">
                    <i class="ph-bold ph-compass"></i> Facing ${item.heading}°
                  </span>
                  <a href="${item.mapUrl}" target="_blank" rel="noopener noreferrer" class="text-blue-400 hover:text-blue-300 inline-flex items-center gap-1">
                    Direct Link <i class="ph ph-arrow-square-out"></i>
                  </a>
                </div>
              </div>
            `;
          } else {
            // Free No-Key Mode: Exact angle card with direct link
            contentMarkup = `
              <div class="aspect-video bg-gradient-to-br from-gray-900 to-[#070a13] relative flex flex-col justify-between p-4 border-b border-gray-800">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-semibold text-amber-400 bg-amber-950/80 border border-amber-800/80 px-2.5 py-0.5 rounded-full flex items-center gap-1.5">
                    <i class="ph-bold ph-street-view text-sm"></i> Exact 360° Panorama
                  </span>
                  <span class="text-[11px] text-gray-400 font-mono">Heading: ${item.heading}°</span>
                </div>

                <div class="my-auto text-center py-2">
                  <i class="ph-duotone ph-map-pin text-3xl text-blue-400 mb-1"></i>
                  <p class="text-sm font-semibold text-gray-100">${item.title}</p>
                  <p class="text-xs text-gray-400">${item.location}</p>
                  <p class="text-[11px] text-gray-500 font-mono mt-0.5">${item.lat.toFixed(5)}, ${item.lng.toFixed(5)}</p>
                </div>

                <div class="flex items-center justify-between gap-2 pt-2 border-t border-gray-800/70">
                  <button onclick="promptForApiKey()" class="text-[11px] text-gray-400 hover:text-blue-400 underline underline-offset-2">
                    Enable In-Page Embed
                  </button>
                  <a href="${item.mapUrl}" target="_blank" rel="noopener noreferrer" 
                     class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded text-xs font-semibold inline-flex items-center gap-1.5 transition shadow">
                    Launch Exact 360° <i class="ph-bold ph-arrow-square-out"></i>
                  </a>
                </div>
              </div>
            `;
          }
        }

        const badgeColor = item.kind === 'LIVE' ? 'bg-emerald-950 text-emerald-400 border-emerald-800' : 'bg-amber-950 text-amber-400 border-amber-800';

        card.innerHTML = `
          <div class="px-4 py-3 bg-gray-900 border-b border-gray-800 flex items-center justify-between">
            <div class="truncate mr-2">
              <div class="flex items-center gap-2">
                <h2 class="text-sm font-semibold text-white tracking-wide truncate">${item.title}</h2>
                <span class="text-[9px] uppercase font-bold px-1.5 py-0.5 rounded border ${badgeColor}">
                  ${item.kind === 'LIVE' ? 'LIVE' : 'STREET 360°'}
                </span>
              </div>
              <p class="text-xs text-gray-400 flex items-center gap-1 truncate mt-0.5">
                <i class="ph-bold ph-map-pin text-blue-400"></i> ${item.location}
              </p>
            </div>
            <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-gray-800 text-gray-300 border border-gray-700 whitespace-nowrap">
              ${item.category}
            </span>
          </div>
          ${contentMarkup}
        `;
        grid.appendChild(card);
      });

      if (window.lwwWidgetInit) {
        window.lwwWidgetInit();
      }
    }

    function promptForApiKey() {
      const current = localStorage.getItem('gmaps_api_key') || '';
      const key = prompt(
        'To display live 360° Street Views directly inside this page without leaving the tab, enter your Google Maps Embed API Key:\n\n(Leave empty to use 1-click launch mode)',
        current
      );
      if (key !== null) {
        localStorage.setItem('gmaps_api_key', key.trim());
        renderLocations(items);
      }
    }

    function setGrid(cols) {
      const grid = document.getElementById('locationGrid');
      grid.className = `grid gap-5 ${
        cols === 1 ? 'grid-cols-1' :
        cols === 2 ? 'grid-cols-1 md:grid-cols-2' :
        cols === 3 ? 'grid-cols-1 md:grid-cols-2 xl:grid-cols-3' :
        'grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4'
      }`;
    }

    function filterLocations() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filter = document.getElementById('categoryFilter').value;

      const filtered = items.filter(c => {
        const matchesQuery = 
          c.title.toLowerCase().includes(q) || 
          c.location.toLowerCase().includes(q) || 
          c.category.toLowerCase().includes(q);

        let matchesCat = true;
        if (filter === 'LIVE') matchesCat = (c.kind === 'LIVE');
        else if (filter === 'STREET') matchesCat = (c.kind === 'STREET');
        else if (filter !== 'ALL') matchesCat = (c.category === filter);

        return matchesQuery && matchesCat;
      });

      renderLocations(filtered);
    }

    function reloadAll() {
      renderLocations(items);
    }

    // Initial load
    renderLocations(items);
  </script>
</body>
</html>
