<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- CRITICAL: Provides valid HTTP referrer to YouTube on GitHub Pages to prevent Error 153 -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>EarthLens — Global Live Webcams</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    body { background-color: #0b0f19; color: #f1f5f9; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .camera-card { background: #111827; border: 1px solid #1f2937; border-radius: 0.75rem; overflow: hidden; transition: border-color 0.2s, box-shadow 0.2s; }
    .camera-card:hover { border-color: #3b82f6; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
    .aspect-video { aspect-ratio: 16 / 9; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Sticky Header -->
  <header class="sticky top-0 z-50 bg-[#0d1424]/95 backdrop-blur border-b border-gray-800 px-4 py-3">
    <div class="max-w-[1920px] mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center text-white text-xl shadow-md shadow-blue-500/20">
          <i class="ph-bold ph-video-camera"></i>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <h1 class="font-bold text-lg tracking-wide text-white">EarthLens</h1>
            <span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800/80 flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> LIVE
            </span>
          </div>
          <p class="text-xs text-gray-400" id="camCountLabel">14 Live Earth Streams</p>
        </div>
      </div>

      <!-- Controls & Filter Toolbar -->
      <div class="flex flex-wrap items-center gap-2">
        <!-- Search -->
        <div class="relative">
          <i class="ph ph-magnifying-glass absolute left-3 top-2.5 text-gray-400"></i>
          <input
            id="searchInput"
            type="text"
            placeholder="Search city, country..."
            class="bg-gray-900 border border-gray-700 text-sm text-gray-200 pl-9 pr-3 py-1.5 rounded-lg focus:outline-none focus:border-blue-500 w-44 md:w-56"
            oninput="filterWebcams()"
          />
        </div>

        <!-- Category Dropdown -->
        <select 
          id="categoryFilter" 
          onchange="filterWebcams()" 
          class="bg-gray-900 border border-gray-700 text-sm text-gray-200 px-3 py-1.5 rounded-lg focus:outline-none focus:border-blue-500">
          <option value="ALL">All Regions</option>
          <option value="Norway">Norway</option>
          <option value="Europe">Europe</option>
          <option value="Russia">Russia</option>
          <option value="Animals">Animals / Nature</option>
        </select>

        <!-- Grid column buttons -->
        <div class="hidden sm:flex bg-gray-900 border border-gray-800 rounded-lg p-1 space-x-1">
          <button onclick="setGrid(1)" title="1 Column" class="p-1.5 hover:bg-gray-800 rounded text-gray-400 hover:text-white"><i class="ph-bold ph-square"></i></button>
          <button onclick="setGrid(2)" title="2 Columns" class="p-1.5 hover:bg-gray-800 rounded text-gray-400 hover:text-white"><i class="ph-bold ph-columns"></i></button>
          <button onclick="setGrid(3)" title="3 Columns" class="p-1.5 bg-gray-800 rounded text-blue-400"><i class="ph-bold ph-grid-four"></i></button>
          <button onclick="setGrid(4)" title="4 Columns" class="p-1.5 hover:bg-gray-800 rounded text-gray-400 hover:text-white"><i class="ph-bold ph-grid-nine"></i></button>
        </div>

        <!-- Reload Streams -->
        <button onclick="reloadAll()" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs font-medium rounded-lg flex items-center gap-1.5 border border-gray-700 transition">
          <i class="ph ph-arrows-clockwise"></i> Reload All
        </button>
      </div>
    </div>
  </header>

  <!-- Webcams Grid -->
  <main class="flex-1 max-w-[1920px] w-full mx-auto p-4 md:p-6">
    <div id="webcamGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
      <!-- Injected via JavaScript -->
    </div>
  </main>

  <footer class="py-4 border-t border-gray-800 text-center text-xs text-gray-500">
    EarthLens &bull; GitHub Pages Live Monitoring &bull; All 14 feeds streaming in-page
  </footer>

  <script>
    // 14 distinct streams (Duplicate Siberia removed)
    const webcams = [
      { id: 'LZtcropXJcc', title: 'Lensk City', location: 'Sakha Republic, Russia', category: 'Russia' },
      { id: 'B1r1sD5yKSQ', title: 'Lena River & Siberia View', location: 'Lena River, Siberia', category: 'Russia' },
      { id: 'kcQgF5qlSxE', title: 'Notting Hill Gate', location: 'West London, UK', category: 'Europe' },
      { id: 'enYFXf8u7Lc', title: 'Swiss Alps Panoramic', location: 'Alps, Switzerland', category: 'Europe' },
      { id: 'mt7uE-n0YPI', title: 'Venice Skyline', location: 'Venice, Italy', category: 'Europe' },
      { id: 'r8N6IsoIkTk', title: 'Venice Grand Canal', location: 'Venice, Italy', category: 'Europe' },
      { id: 'xlepdTYU6G4', title: 'Harstad Harbor', location: 'Harstad, Norway', category: 'Norway' },
      { id: 'faKBmRq0lYg', title: 'Oslo Cityscape', location: 'Oslo, Norway', category: 'Norway' },
      { 
        type: 'panomax',
        panomaxUrl: 'https://loenskylift.panomax.com/',
        externalUrl: 'https://liveworldwebcams.com/lodalen-loen-live-webcam-norway/',
        title: 'Mt. Hoven & Lodalen Valley', 
        location: 'Loen, Nordfjord, Norway', 
        category: 'Norway' 
      },
      { id: '2D8hhRDEzwY', title: 'Mehamn Arctic Coast', location: 'Finnmark, Norway', category: 'Norway' },
      { id: 'Gd9d4q6WvUY', title: 'Amsterdam Canals', location: 'Amsterdam, Netherlands', category: 'Europe' },
      { id: 'UCgLr29bxO8', title: 'Rhine Falls', location: 'Neuhausen, Switzerland', category: 'Europe' },
      { id: 'lsxYH2XQQCg', title: 'Japan Monkey Center', location: 'Aichi, Japan', category: 'Animals' },
      { id: 'SUXPnIEpbn4', title: 'Chengdu Panda Base', location: 'Sichuan, China', category: 'Animals' }
    ];

    function renderWebcams(data) {
      const grid = document.getElementById('webcamGrid');
      grid.innerHTML = '';
      document.getElementById('camCountLabel').textContent = `${data.length} Live Earth Streams`;

      data.forEach(cam => {
        const card = document.createElement('div');
        card.className = 'camera-card flex flex-col shadow-lg';
        
        let videoMarkup = '';

        if (cam.type === 'panomax') {
          // Direct Panomax 360 interactive embed with responsive controls & link
          videoMarkup = `
            <div class="aspect-video bg-black relative flex flex-col">
              <iframe
                src="${cam.panomaxUrl}"
                title="${cam.title}"
                class="w-full h-full border-0"
                allow="fullscreen; accelerometer; gyroscope"
                referrerpolicy="no-referrer-when-downgrade"
                loading="lazy">
              </iframe>
              <div class="bg-gray-950/90 px-3 py-1.5 flex items-center justify-between text-[11px] text-gray-400 border-t border-gray-800">
                <span class="flex items-center gap-1.5 text-blue-400">
                  <i class="ph-bold ph-arrows-out-cardinal"></i> Panomax 360° Interactive View
                </span>
                <a href="${cam.externalUrl}" target="_blank" rel="noopener noreferrer" class="hover:text-white flex items-center gap-1">
                  Source Page <i class="ph ph-arrow-square-out"></i>
                </a>
              </div>
            </div>
          `;
        } else {
          // YouTube nocookie embed with strict referrer passing
          const embedUrl = `https://www.youtube-nocookie.com/embed/${cam.id}?autoplay=1&mute=1&playsinline=1&rel=0&enablejsapi=1`;
          videoMarkup = `
            <div class="aspect-video bg-black relative">
              <iframe
                src="${embedUrl}"
                title="${cam.title}"
                class="w-full h-full border-0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                loading="lazy"
                allowfullscreen>
              </iframe>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="px-4 py-3 bg-gray-900 border-b border-gray-800 flex items-center justify-between">
            <div class="truncate mr-2">
              <h2 class="text-sm font-semibold text-white tracking-wide truncate">${cam.title}</h2>
              <p class="text-xs text-gray-400 flex items-center gap-1 truncate">
                <i class="ph-bold ph-map-pin text-blue-400"></i> ${cam.location}
              </p>
            </div>
            <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-gray-800 text-gray-300 border border-gray-700 whitespace-nowrap">
              ${cam.category}
            </span>
          </div>
          ${videoMarkup}
        `;
        grid.appendChild(card);
      });
    }

    function setGrid(cols) {
      const grid = document.getElementById('webcamGrid');
      grid.className = `grid gap-5 ${
        cols === 1 ? 'grid-cols-1' :
        cols === 2 ? 'grid-cols-1 md:grid-cols-2' :
        cols === 3 ? 'grid-cols-1 md:grid-cols-2 xl:grid-cols-3' :
        'grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4'
      }`;
    }

    function filterWebcams() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const cat = document.getElementById('categoryFilter').value;

      const filtered = webcams.filter(c => {
        const matchesQuery = 
          c.title.toLowerCase().includes(q) || 
          c.location.toLowerCase().includes(q) || 
          c.category.toLowerCase().includes(q);
        const matchesCat = (cat === 'ALL' || c.category === cat);
        return matchesQuery && matchesCat;
      });

      renderWebcams(filtered);
    }

    function reloadAll() {
      renderWebcams(webcams);
    }

    // Initial render
    renderWebcams(webcams);
  </script>
</body>
</html>
