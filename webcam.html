    /* ================= Live World Webcams dynamic resolver =================
       Each LWW card is looked up by name on liveworldwebcams.com (WordPress REST
       search), then shown through LWW's own embed widget. LWW keeps the widget
       pointed at the camera's current source, so nothing here goes stale.
       Pin a camera manually with { widgetId: '12345' } or { slug: 'page-slug' }. */
    const LWW_BASE = 'https://liveworldwebcams.com';
    const LWW_CACHE_KEY = 'lww_resolve_v1';
    const LWW_TTL = 7 * 24 * 3600 * 1000;
    let lwwCache = {};
    try { lwwCache = JSON.parse(localStorage.getItem(LWW_CACHE_KEY) || '{}'); } catch (e) {}
    const saveLwwCache = () => { try { localStorage.setItem(LWW_CACHE_KEY, JSON.stringify(lwwCache)); } catch (e) {} };

    async function fetchJson(url, ms = 9000) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), ms);
      try {
        const r = await fetch(url, { headers: { Accept: 'application/json' }, signal: ctrl.signal });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return await r.json();
      } finally { clearTimeout(t); }
    }

    function scoreHit(hit, q, slug) {
      const url = (hit.url || '').toLowerCase();
      const title = (hit.title || '').toLowerCase();
      if (!url.startsWith(LWW_BASE) || url === LWW_BASE + '/') return -1;
      if (/\/(articles|category|tag|author|favorites|go)\//.test(url)) return -1;
      let s = 0, matched = 0;
      if (slug && url.includes('/' + slug)) { s += 100; matched++; }
      q.toLowerCase().split(/\s+/).filter(Boolean).forEach(w => {
        if (title.includes(w) || url.includes(w)) { matched++; s += 5; }
      });
      if (!matched) return -1;
      if (/cam|live/.test(url)) s += 4;
      return s;
    }

    async function resolveLww(item) {
      if (item.widgetId) return { id: String(item.widgetId), page: item.pageUrl || '' };

      const key = item.slug || item.title;
      const hit = lwwCache[key];
      if (hit && Date.now() - hit.t < LWW_TTL) return hit;

      const queries = [...(item.slug ? [item.slug.replace(/-/g, ' ')] : []), ...(item.queries || [item.title])];
      let lastErr = null;
      for (const q of queries) {
        try {
          const results = await fetchJson(`${LWW_BASE}/wp-json/wp/v2/search?search=${encodeURIComponent(q)}&per_page=20&_fields=id,title,url`);
          const best = results
            .map(r => ({ r, s: scoreHit(r, q, item.slug) }))
            .filter(x => x.s >= 0)
            .sort((a, b) => b.s - a.s)[0];
          if (best) {
            const out = { id: String(best.r.id), page: best.r.url, t: Date.now() };
            lwwCache[key] = out; saveLwwCache();
            return out;
          }
        } catch (e) { lastErr = e; }
      }
      throw lastErr || new Error('No matching webcam found on liveworldwebcams.com');
    }

    function lwwWidgetMarkup(id, page) {
      return `
        <div data-lww-widget data-mode="specific" data-id="${id}" data-api="${LWW_BASE}/wp-json/lww/v1/widget" data-utm="lww-widget" class="w-full h-full"></div>

        <div class="absolute bottom-1 right-2 z-10 bg-black/75 px-2 py-0.5 rounded text-[10px] text-gray-400">
          Powered by <a href="${page || LWW_BASE + '/'}" target="_blank" rel="noopener" class="text-blue-400 hover:underline">Live World Webcams</a>
        </div>`;
    }

    function lwwFailMarkup(item, err) {
      const q = encodeURIComponent((item.queries && item.queries[0]) || item.title);
      console.warn('[EarthLens] Could not resolve', item.title, err);
      return `
        <div class="w-full h-full flex flex-col items-center justify-center gap-2 p-4 text-center">
          <i class="ph-bold ph-video-camera-slash text-3xl text-gray-500"></i>
          <p class="text-sm text-gray-300">Couldn't load this stream right now</p>
          <p class="text-[10px] text-red-400 break-all max-w-full">${(err && err.message) || err} ${/Failed to fetch|NetworkError/i.test((err && err.message) || '') ? '(blocked by browser/CORS or offline)' : ''}</p>
          <div class="flex gap-2">
            <a href="${LWW_BASE}/?s=${q}" target="_blank" rel="noopener" class="px-3 py-1 text-xs bg-blue-600 hover:bg-blue-500 rounded-md text-white">Find on Live World Webcams</a>
            <button onclick="reloadAll()" class="px-3 py-1 text-xs bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-md text-gray-200">Retry</button>
          </div>
        </div>`;
    }

    function loadLwwScript() {
      document.querySelectorAll('script[data-lww-loader]').forEach(s => s.remove());
      const s = document.createElement('script');
      s.async = true;
      s.dataset.lwwLoader = '1';
      s.src = `${LWW_BASE}/wp-content/plugins/lww-embed-widget/assets/widget.js?cb=${Date.now()}`;
      s.onload = () => { if (window.lwwWidgetInit) { try { window.lwwWidgetInit(); } catch (e) {} } };
      document.head.appendChild(s);
    }

    let renderToken = 0;

    async function renderLocations(data) {
      const token = ++renderToken;
      const lwwJobs = [];
      const grid = document.getElementById('locationGrid');
      grid.innerHTML = '';
      document.getElementById('camCountLabel').textContent = `${data.length} Locations & Streams`;

      const apiKey = localStorage.getItem('gmaps_api_key') || '';
      const keyBtn = document.getElementById('apiKeyBtnText');
      if (keyBtn) keyBtn.textContent = apiKey ? 'Key Active' : 'API Key';

      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'camera-card flex flex-col shadow-lg';
        
        let contentMarkup = '';

        if (item.type === 'lww') {
          const slotId = `lww-slot-${token}-${lwwJobs.length}`;
          contentMarkup = `
            <div id="${slotId}" class="aspect-video bg-gray-950 relative flex flex-col justify-center items-center overflow-hidden">
              <div class="flex items-center gap-2 text-xs text-gray-500"><i class="ph ph-circle-notch animate-spin text-lg"></i> Finding live stream…</div>
            </div>
          `;
          lwwJobs.push({ item, slotId });
        } else if (item.type === 'panomax') {
          contentMarkup = `
            <div class="aspect-video bg-black relative flex flex-col">
              <iframe
                src="${item.panomaxUrl}"
                title="${item.title}"
                class="w-full h-full border-0"
                allow="fullscreen; accelerometer; gyroscope"
                referrerpolicy="no-referrer-when-downgrade"

                <span class="flex items-center gap-1.5 text-blue-400">

                <a href="${item.externalUrl}" target="_blank" rel="noopener noreferrer" class="hover:text-white flex items-center gap-1">
                  Source <i class="ph ph-arrow-square-out"></i>
                </a>
              </div>
            </div>
          `;
        } else if (item.type === 'streetview') {
          if (apiKey) {
            // Official Street View API: respects exact coordinates and camera heading/pitch
            const embedUrl = `https://www.google.com/maps/embed/v1/streetview?key=${apiKey}&location=${item.lat},${item.lng}&heading=${item.heading}&pitch=${item.pitch}&fov=${item.fov || 90}`;
            contentMarkup = `
              <div class="aspect-video bg-black relative">
                <iframe
                  src="${embedUrl}"
                  title="${item.title} 360 Street View"
                  class="w-full h-full border-0"
                  allowfullscreen
                  loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade">
                </iframe>
                <div class="bg-gray-950/95 px-3 py-1.5 flex items-center justify-between text-[11px] border-t border-gray-800">
                  <span class="text-amber-400 font-medium flex items-center gap-1.5">
                    <i class="ph-bold ph-compass"></i> Facing ${item.heading}°
                  </span>
                  <a href="${item.mapUrl}" target="_blank" rel="noopener noreferrer" class="text-blue-400 hover:text-blue-300 inline-flex items-center gap-1">
                    Direct Link <i class="ph ph-arrow-square-out"></i>
                  </a>
                </div>
              </div>
            `;
          } else {
            // Free No-Key Mode: Exact angle card with direct link
            contentMarkup = `
              <div class="aspect-video bg-gradient-to-br from-gray-900 to-[#070a13] relative flex flex-col justify-between p-4 border-b border-gray-800">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-semibold text-amber-400 bg-amber-950/80 border border-amber-800/80 px-2.5 py-0.5 rounded-full flex items-center gap-1.5">
                    <i class="ph-bold ph-street-view text-sm"></i> Exact 360° Panorama
                  </span>
                  <span class="text-[11px] text-gray-400 font-mono">Heading: ${item.heading}°</span>
                </div>

                <div class="my-auto text-center py-2">
                  <i class="ph-duotone ph-map-pin text-3xl text-blue-400 mb-1"></i>
                  <p class="text-sm font-semibold text-gray-100">${item.title}</p>
                  <p class="text-xs text-gray-400">${item.location}</p>
                  <p class="text-[11px] text-gray-500 font-mono mt-0.5">${item.lat.toFixed(5)}, ${item.lng.toFixed(5)}</p>
                </div>

                <div class="flex items-center justify-between gap-2 pt-2 border-t border-gray-800/70">
                  <button onclick="promptForApiKey()" class="text-[11px] text-gray-400 hover:text-blue-400 underline underline-offset-2">
                    Enable In-Page Embed
                  </button>
                  <a href="${item.mapUrl}" target="_blank" rel="noopener noreferrer" 
                     class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded text-xs font-semibold inline-flex items-center gap-1.5 transition shadow">
                    Launch Exact 360° <i class="ph-bold ph-arrow-square-out"></i>
                  </a>
                </div>
              </div>
            `;
          }
        }

        const badgeColor = item.kind === 'LIVE' ? 'bg-emerald-950 text-emerald-400 border-emerald-800' : 'bg-amber-950 text-amber-400 border-amber-800';

        card.innerHTML = `
          <div class="px-4 py-3 bg-gray-900 border-b border-gray-800 flex items-center justify-between">
            <div class="truncate mr-2">
              <div class="flex items-center gap-2">
                <h2 class="text-sm font-semibold text-white tracking-wide truncate">${item.title}</h2>
                <span class="text-[9px] uppercase font-bold px-1.5 py-0.5 rounded border ${badgeColor}">
                  ${item.kind === 'LIVE' ? 'LIVE' : 'STREET 360°'}
                </span>
              </div>
              <p class="text-xs text-gray-400 flex items-center gap-1 truncate mt-0.5">
                <i class="ph-bold ph-map-pin text-blue-400"></i> ${item.location}
              </p>
            </div>
            <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-gray-800 text-gray-300 border border-gray-700 whitespace-nowrap">
              ${item.category}
            </span>
          </div>
          ${contentMarkup}
        `;
        grid.appendChild(card);
      });

      await Promise.allSettled(lwwJobs.map(async ({ item, slotId }) => {
        let html;
        try {
          const res = await resolveLww(item);
          html = lwwWidgetMarkup(res.id, res.page);
        } catch (err) {
          html = lwwFailMarkup(item, err);
        }
        if (token !== renderToken) return;           // a newer render replaced this one
        const slot = document.getElementById(slotId);
        if (slot) slot.innerHTML = html;
      }));
      if (token === renderToken && lwwJobs.length) loadLwwScript();
    }

    function promptForApiKey() {
      const current = localStorage.getItem('gmaps_api_key') || '';
      const key = prompt(
        'To display live 360° Street Views directly inside this page without leaving the tab, enter your Google Maps Embed API Key:\n\n(Leave empty to use 1-click launch mode)',
        current
      );
      if (key !== null) {
        localStorage.setItem('gmaps_api_key', key.trim());
        renderLocations(items);
      }
    }

      const filter = document.getElementById('categoryFilter').value;

      const filtered = items.filter(c => {
        const matchesQuery = 
          c.title.toLowerCase().includes(q) || 
          c.location.toLowerCase().includes(q) || 
          c.category.toLowerCase().includes(q);

        let matchesCat = true;
        if (filter === 'LIVE') matchesCat = (c.kind === 'LIVE');
        else if (filter === 'STREET') matchesCat = (c.kind === 'STREET');
        else if (filter !== 'ALL') matchesCat = (c.category === filter);

        return matchesQuery && matchesCat;
      });

      renderLocations(filtered);
    }

    function reloadAll() {
      renderLocations(items);
    }

    // Initial load
    renderLocations(items);
  </script>
</body>
</html>
